            allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe class="video" src="https://www.youtube.com/embed/clSIo5WFmbw?si=IJ5PkjsKYFCRIlsQ"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

        </div>
        <div class="video-container">
          <iframe class="video" src="https://www.youtube.com/embed/oUoFDeSHQe0?si=eOt0wIetBMzexldP"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe class="video" src="https://www.youtube.com/embed/NqLNT_qzYA8?si=nMGpuuZrQJamNgTd"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe class="video" src="https://www.youtube.com/embed/GbWWn4ajElo?si=X2Alef3-sCLVuk4I"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe class="video" src="https://www.youtube.com/embed/ZubY0nJZeeU?si=2d6_Ip6r_vN2Oygw"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
      </section>

      <section class="mainbox" id="offSection">
        <div class="video-container2">
          <iframe class="video"
            src="https://www.youtube.com/embed/GGEaALiuIts?si=EEu-Vk2_T8szK7v7?autoplay=1&mute=1&playsinline=1&rel=0"

      <section class="subbox">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfJUBzOnsBO6ikiV5pp7APwHz7zsF-HjJ5Ulna-6GC5XS0IIg/viewform?usp=header"
          target="_blank">
          <button class="form">오디션 지원하기</button>
        </a>
      </section>

      <section class="carousel">
        <div class="carousel-container">
          <img src="img/2023년봄포스터.jpg" alt="2023년 봄 정기공연" class="poster">
          <img src="img/2023년가을포스터.jpg" alt="2023년 가을 정기공연" class="poster">
          <img src="img/2024년봄포스터.jpg" alt="2024년 봄 정기공연" class="poster">
          <img src="img/2024년가을포스터.jpg" alt="2024년 가을 정기공연" class="poster">
          <img src="img/2025년봄포스터.jpg" alt="2025년 봄 정기공연" class="poster">
          <img src="img/2025년가을포스터.jpg" alt="2025년 가을 정기공연" class="poster">
        </div>
      </section>

    </main>

    <footer>
      <div class="more">about arpeggio</div>
      <div class="button">
        <a href="https://youtube.com/@kgu_arpeggio" target="_blank">
          <img src="img/youtube.png" alt="YouTube" class="youtube"></a>
        <a href="https://www.instagram.com/kgu_arpeggio" target="_blank">
          <img src="img/instagram.png" alt="Instagram" class="instagram"></a>
      </div>
    </footer>
  </div>

  <script>
    const onSection = document.getElementById("onSection");
    const offSection = document.getElementById("offSection");
    const onBtn = document.getElementById("onBtn");
    const offBtn = document.getElementById("offBtn");

    function showOn() {
      onSection.style.display = "flex";
      offSection.style.display = "none";

      onBtn.classList.add("active");
      offBtn.classList.remove("active");
    }

    function showOff() {
      onSection.style.display = "none";
      offSection.style.display = "flex";

      offBtn.classList.add("active");
      onBtn.classList.remove("active");

      const video1 = document.getElementById("offVideo1");
      video1.src = video1.src;
    }

    // 처음 로드될 때 ON 활성화
    showOn();

    const posters = document.querySelectorAll(".poster");
    let current = 0;

    function updateCarousel() {
      posters.forEach((poster, index) => {
        const offset = index - current;

        poster.style.opacity = Math.abs(offset) > 2 ? "0" : "1";
        poster.style.zIndex = 10 - Math.abs(offset);

        if (offset === 0) {
          // 가운데
          poster.style.transform = "translateX(0) scale(1)";
        }
        else if (offset === -1) {
          // 왼쪽 바로 옆
          poster.style.transform = "translateX(-60%) scale(0.85)";
        }
        else if (offset === 1) {
          // 오른쪽 바로 옆
          poster.style.transform = "translateX(60%) scale(0.85)";
        }
        else if (offset === -2) {
          poster.style.transform = "translateX(-100%) scale(0.7)";
        }
        else if (offset === 2) {
          poster.style.transform = "translateX(100%) scale(0.7)";
        }
      });
    }

    function nextSlide() {
      current = (current + 1) % posters.length;
      updateCarousel();
    }

    function prevSlide() {
      current = (current - 1 + posters.length) % posters.length;
      updateCarousel();
    }

    document.querySelector(".carousel").addEventListener("click", nextSlide);

    updateCarousel();
  </script>

</body>

</html>
